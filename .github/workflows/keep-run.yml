name: Daily Date

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Generate date file
        run: |
          date > date.txt

      - name: Commit and push changes
        run: |
          git checkout --force -b date
          git add date.txt
          git commit -m "Update date.txt"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: date
          force: true

      # ------------------------------------------------------
      # Supabase Query Using LIMIT 1
      # ------------------------------------------------------
      - name: Query Supabase with limit 1
        shell: bash
        run: |
          # request only one row
          curl -s \
            "${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=*&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json"
